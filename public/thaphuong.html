<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thắp Hương & Bốc Quẻ Tịnh Tâm - Cõi Trời Thiên Cung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #060507;
      --gold: #d4af37;
      --gold-bright: #ffeaa7;
      --gold-glow: rgba(212, 175, 55, 0.28);
      --text: #eae6de;
      --text-dim: #9e978a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
    }

    /* 1. NỀN THIÊN ĐÌNH */
    .heaven-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 50% 15%, #241938 0%, #110d1c 45%, #060508 85%);
      overflow: hidden;
      contain: strict;
    }

    .heaven-palace {
      position: absolute;
      top: 2%;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(320px, 60vw, 580px);
      height: auto;
      opacity: 0.38;
      filter: drop-shadow(0 0 15px rgba(241, 196, 15, 0.3));
    }

    .cloud-layer {
      position: absolute;
      width: 220%;
      height: 180px;
      pointer-events: none;
    }

    .cloud-back {
      bottom: 24%;
      left: -20%;
      opacity: 0.25;
      background: radial-gradient(ellipse at 50% 100%, rgba(220, 200, 255, 0.35) 0%, rgba(180, 160, 230, 0.1) 50%, transparent 80%);
      animation: driftClouds 55s linear infinite alternate;
    }

    .cloud-front {
      bottom: 0;
      left: -10%;
      width: 220%;
      height: 220px;
      opacity: 0.28;
      background: radial-gradient(ellipse at 50% 100%, rgba(255, 240, 210, 0.4) 0%, rgba(240, 210, 160, 0.1) 45%, transparent 75%);
      animation: driftClouds 40s linear infinite alternate-reverse;
    }

    @keyframes driftClouds {
      0% { transform: translateX(0); }
      100% { transform: translateX(-15%); }
    }

    .celestial-pillar {
      position: absolute;
      bottom: 0;
      width: clamp(25px, 4vw, 45px);
      height: 65%;
      opacity: 0.22;
      background: linear-gradient(to top, rgba(212, 175, 55, 0.4), rgba(212, 175, 55, 0.05));
      border: 1px solid rgba(212, 175, 55, 0.25);
    }

    .pillar-left { left: 16px; border-radius: 8px 8px 0 0; }
    .pillar-right { right: 16px; border-radius: 8px 8px 0 0; }

    #petalCanvas, #fxCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #petalCanvas { z-index: 2; }
    #fxCanvas { z-index: 6; }

    /* 2. NHÂN VẬT THẦN TIÊN BAY LƯỢN */
    .buddha-realm {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
      contain: layout paint;
    }

    .divine-figure {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.25s ease;
      will-change: transform;
    }

    .divine-figure:hover {
      transform: scale(1.12);
    }

    #buddha {
      top: 3%;
      left: -200px;
      width: 135px;
      height: 135px;
      animation: flyLoopA 32s linear infinite, bobbleA 4s ease-in-out infinite alternate;
    }

    #guanyin {
      top: 7%;
      right: -190px;
      width: 110px;
      height: 130px;
      animation: flyLoopB 28s linear infinite 4s, bobbleB 3.6s ease-in-out infinite alternate;
    }

    #jadeEmperor {
      top: 9%;
      left: -190px;
      width: 115px;
      height: 130px;
      animation: flyLoopA 30s linear infinite 12s, bobbleA 3.8s ease-in-out infinite alternate;
    }

    #tripitaka {
      top: 18%;
      left: -160px;
      width: 95px;
      height: 90px;
      animation: flyLoopA 25s linear infinite 2s, bobbleA 3s ease-in-out infinite alternate;
    }

    #dragonHorse {
      top: 21%;
      left: -290px;
      width: 95px;
      height: 85px;
      animation: flyLoopA 25s linear infinite 2s, bobbleB 2.4s ease-in-out infinite alternate;
    }

    #wukong {
      top: 13%;
      left: -170px;
      width: 105px;
      height: 90px;
      animation: flyLoopA 19s linear infinite 6s, bobbleB 2s ease-in-out infinite alternate;
    }

    #bajie {
      top: 28%;
      right: -170px;
      width: 95px;
      height: 85px;
      animation: flyLoopB 23s linear infinite 8s, bobbleA 2.8s ease-in-out infinite alternate;
    }

    #bullKing {
      top: 35%;
      left: -180px;
      width: 110px;
      height: 100px;
      animation: flyLoopA 28s linear infinite 14s, bobbleA 3.2s ease-in-out infinite alternate;
    }

    #redBoy {
      top: 31%;
      right: -170px;
      width: 85px;
      height: 85px;
      animation: flyLoopB 17s linear infinite 3s, bobbleB 1.8s ease-in-out infinite alternate;
    }

    @keyframes flyLoopA {
      0% { left: -220px; transform: scaleX(1); }
      48% { left: calc(100vw + 60px); transform: scaleX(1); }
      50% { left: calc(100vw + 60px); transform: scaleX(-1); }
      98% { left: -220px; transform: scaleX(-1); }
      100% { left: -220px; transform: scaleX(1); }
    }

    @keyframes flyLoopB {
      0% { right: -220px; transform: scaleX(1); }
      48% { right: calc(100vw + 60px); transform: scaleX(1); }
      50% { right: calc(100vw + 60px); transform: scaleX(-1); }
      98% { right: -220px; transform: scaleX(-1); }
      100% { right: -220px; transform: scaleX(1); }
    }

    @keyframes bobbleA {
      0% { margin-top: 0px; rotate: -4deg; }
      100% { margin-top: 18px; rotate: 4deg; }
    }

    @keyframes bobbleB {
      0% { margin-top: 0px; rotate: 5deg; }
      100% { margin-top: 18px; rotate: -5deg; }
    }

    .buddha-halo {
      transform-origin: 80px 65px;
      animation: haloRotate 20s linear infinite;
    }

    @keyframes haloRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .mantra-bubble {
      position: fixed;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      color: #ffeaa7;
      text-shadow: 0 0 10px #f39c12;
      pointer-events: none;
      font-weight: 700;
      animation: floatUpWord 1.5s ease-out forwards;
      z-index: 30;
      white-space: nowrap;
    }

    @keyframes floatUpWord {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      20% { opacity: 1; transform: translateY(-15px) scale(1.05); }
      80% { opacity: 0.9; transform: translateY(-40px) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(0.9); }
    }

    /* Nút Bật/Tắt Nhạc Nổi Góc Phải */
    .music-control-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 50;
      background: rgba(18, 14, 5, 0.75);
      border: 1px solid var(--gold);
      color: var(--gold-bright);
      padding: 8px 14px;
      border-radius: 20px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .music-control-btn:hover {
      background: var(--gold);
      color: #120e05;
      transform: translateY(-2px);
    }

    .music-control-btn.playing {
      border-color: #2ed573;
      color: #2ed573;
    }

    .celestial-glow {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(280px, 80vw, 480px);
      height: clamp(280px, 80vw, 480px);
      background: radial-gradient(circle, var(--gold-glow) 0%, transparent 68%);
      pointer-events: none;
      z-index: 1;
      transition: opacity 1s ease;
      opacity: 0.45;
    }

    header {
      padding-top: clamp(2.5rem, 6vh, 3.5rem);
      text-align: center;
      z-index: 3;
      padding-left: 1rem;
      padding-right: 1rem;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      letter-spacing: 0.25em;
      color: var(--gold);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
      text-shadow: 0 0 16px rgba(212, 175, 55, 0.4);
    }

    .subtitle {
      font-size: clamp(0.95rem, 2.8vw, 1.1rem);
      color: var(--text-dim);
      letter-spacing: 0.12em;
      font-style: italic;
    }

    /* 3. KHU VỰC BÁT HƯƠNG */
    .incense-stage {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: clamp(300px, 45vh, 380px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      z-index: 3;
    }

    #smokeCanvas {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 4;
    }

    .burner-assembly {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
    }

    .offering-incense-wrapper {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translate3d(-50%, 140px, 0);
      pointer-events: none;
      z-index: 7;
      opacity: 0;
      will-change: transform, opacity;
    }

    .offering-stick {
      width: 3.5px;
      height: 140px;
      background: linear-gradient(to bottom, #d63031 0%, #8b2b1d 20%, #4a150e 100%);
      border-radius: 2px 2px 0 0;
      position: relative;
    }

    .offering-stick::before {
      content: '';
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: #ff5722;
      border-radius: 50%;
      box-shadow: 0 0 10px 3px #ff9800;
    }

    .offering-active {
      animation: elevateAndPlantIncense 3.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes elevateAndPlantIncense {
      0% { opacity: 0; transform: translate3d(-50%, 140px, 0) scale(0.9); }
      22% { opacity: 1; transform: translate3d(-50%, -105px, 0) scale(1.08); }
      48% { opacity: 1; transform: translate3d(-50%, -115px, 0) scale(1.1); }
      78% { opacity: 1; transform: translate3d(-50%, -15px, 0) scale(1); }
      92% { opacity: 1; transform: translate3d(-50%, 0, 0) scale(1); }
      100% { opacity: 0; transform: translate3d(-50%, 0, 0) scale(1); }
    }

    .sticks {
      display: flex;
      gap: 16px;
      margin-bottom: -16px;
      align-items: flex-end;
    }

    .stick {
      width: 3px;
      background: #7a3123;
      position: relative;
      border-radius: 2px 2px 0 0;
    }

    .stick.active::before {
      content: '';
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      background: #ff7300;
      border-radius: 50%;
      box-shadow: 0 0 8px 3px #ff9800;
    }

    .stick-1 { height: 125px; transform: rotate(-3deg); }
    .stick-2 { height: 145px; }
    .stick-3 { height: 125px; transform: rotate(3deg); }

    .censer {
      width: 110px;
      height: 64px;
      background: radial-gradient(circle at 50% 20%, #7d6328 0%, #3e3111 80%, #1e1807 100%);
      border-radius: 0 0 55px 55px;
      border: 1px solid #9f8038;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    .censer-rim {
      width: 124px;
      height: 10px;
      background: #9f8038;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
    }

    .censer-base {
      width: 74px;
      height: 8px;
      background: #544319;
      border-radius: 3px;
      margin-top: 2px;
    }

    /* 4. CỤM ĐIỀU KHIỂN */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: clamp(1.5rem, 4vh, 2.5rem);
      z-index: 3;
      width: 100%;
      padding: 0 1rem;
    }

    .action-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .btn-action {
      border: 2px solid #f1c40f;
      color: #fff4cc;
      padding: clamp(0.75rem, 2vw, 0.85rem) clamp(1.6rem, 5vw, 2.2rem);
      font-size: clamp(1rem, 3.2vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: 45px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(241, 196, 15, 0.35);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .btn-incense {
      background: linear-gradient(135deg, rgba(241, 196, 15, 0.25) 0%, rgba(212, 175, 55, 0.4) 100%);
    }

    .btn-fortune {
      background: linear-gradient(135deg, rgba(231, 76, 60, 0.3) 0%, rgba(192, 57, 43, 0.5) 100%);
      border-color: #ff7675;
      color: #ffeaa7;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(231, 76, 60, 0.4);
    }

    .btn-action:hover { transform: translateY(-2px); }
    .btn-action:active { transform: translateY(1px); }

    .stats {
      font-size: 0.95rem;
      color: var(--text-dim);
      letter-spacing: 0.08em;
    }

    .counter { color: #f1c40f; font-weight: 700; }

    .quote {
      font-style: italic;
      color: #8c8577;
      font-size: 0.9rem;
      max-width: 440px;
      text-align: center;
      line-height: 1.4;
    }

    /* 5. POPUP BẢNG THƯ PHÁP */
    .fortune-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.35s ease;
      padding: 1rem;
    }

    .fortune-modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .fortune-scroll {
      width: 100%;
      max-width: 460px;
      max-height: 90vh;
      overflow-y: auto;
      background: radial-gradient(circle at 50% 20%, #2c1a0e 0%, #150c06 100%);
      border: 2px solid #d4af37;
      border-radius: 12px;
      padding: clamp(1.4rem, 4vw, 2rem) clamp(1.2rem, 3.5vw, 1.8rem);
      box-shadow: 0 0 45px rgba(212, 175, 55, 0.4), inset 0 0 20px rgba(0, 0, 0, 0.8);
      color: #f5eedc;
      position: relative;
      transform: scale(0.92);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
    }

    .fortune-modal-overlay.active .fortune-scroll {
      transform: scale(1);
    }

    .scroll-header {
      font-size: clamp(1.25rem, 4vw, 1.5rem);
      color: #f1c40f;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding-bottom: 0.5rem;
    }

    .fortune-rank {
      display: inline-block;
      margin: 8px 0 12px;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      background: rgba(241, 196, 15, 0.15);
      border: 1px solid #f1c40f;
      color: #ffeaa7;
    }

    .poem-box {
      font-style: italic;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #ffeedb;
      background: rgba(0, 0, 0, 0.35);
      padding: 12px 14px;
      border-radius: 8px;
      border-left: 3px solid #d4af37;
      margin-bottom: 14px;
      white-space: pre-line;
    }

    .explanation-title {
      font-weight: 700;
      color: #d4af37;
      font-size: 1rem;
      margin-bottom: 6px;
      text-align: left;
    }

    .aspects-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      text-align: left;
      font-size: 0.9rem;
      margin-bottom: 14px;
    }

    @media (max-width: 380px) {
      .aspects-grid { grid-template-columns: 1fr; }
    }

    .aspect-item {
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(212, 175, 55, 0.15);
    }

    .aspect-item strong { color: #f1c40f; }

    .advice-box {
      font-size: 0.92rem;
      color: #dcdde1;
      line-height: 1.45;
      text-align: left;
      background: rgba(241, 196, 15, 0.05);
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      border-left: 2px solid #e67e22;
    }

    .btn-close-scroll {
      background: linear-gradient(135deg, #f1c40f 0%, #d4af37 100%);
      color: #150c06;
      border: none;
      font-weight: 700;
      padding: 0.65rem 2.2rem;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      font-family: inherit;
      letter-spacing: 0.1em;
      transition: all 0.2s;
    }

    .btn-close-scroll:hover {
      box-shadow: 0 0 18px rgba(241, 196, 15, 0.7);
      transform: translateY(-1px);
    }

    /* Ống xăm lắc lư */
    .shaker-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 90;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .shaker-container.active { display: flex; }

    .bamboo-tube {
      width: 65px;
      height: 110px;
      background: linear-gradient(to right, #795548, #a1887f 40%, #5d4037 100%);
      border-radius: 6px 6px 14px 14px;
      border: 2px solid #d7ccc8;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
      animation: shakeTube 1.2s ease-in-out infinite alternate;
    }

    @keyframes shakeTube {
      0% { transform: rotate(-16deg) translateY(0); }
      50% { transform: rotate(18deg) translateY(-20px); }
      100% { transform: rotate(-14deg) translateY(0); }
    }
  </style>
</head>

<body>

  <!-- NÚT BẬT TẮT NHẠC TIỆN DỤNG -->
  <button class="music-control-btn" id="musicToggleBtn" onclick="toggleMusic(event)">
    <span id="musicIcon">🎵</span> <span id="musicText">Bật Nhạc</span>
  </button>

  <!-- NỀN THIÊN ĐÌNH -->
  <div class="heaven-backdrop">
    <svg class="heaven-palace" viewBox="0 0 600 240">
      <polygon points="300,20 200,65 400,65" fill="#f39c12" />
      <polygon points="300,55 130,105 470,105" fill="#e67e22" />
      <polygon points="300,95 60,155 540,155" fill="#d35400" />
      <rect x="180" y="155" width="16" height="85" fill="#f1c40f" opacity="0.6" />
      <rect x="240" y="155" width="16" height="85" fill="#f1c40f" opacity="0.6" />
      <rect x="344" y="155" width="16" height="85" fill="#f1c40f" opacity="0.6" />
      <rect x="404" y="155" width="16" height="85" fill="#f1c40f" opacity="0.6" />
      <rect x="270" y="125" width="60" height="24" rx="3" fill="#2c3e50" stroke="#f1c40f" />
      <circle cx="300" cy="137" r="4" fill="#e74c3c" />
    </svg>

    <div class="celestial-pillar pillar-left"></div>
    <div class="celestial-pillar pillar-right"></div>
    <div class="cloud-layer cloud-back"></div>
    <div class="cloud-layer cloud-front"></div>
  </div>

  <!-- BẦU TRỜI CHƯ PHẬT, BỒ TÁT & THẦY TRÒ ĐƯỜNG TĂNG -->
  <div class="buddha-realm">
    <div class="divine-figure" id="buddha" title="Như Lai Phật Tổ">
      <svg viewBox="0 0 160 160" width="100%" height="100%">
        <g class="buddha-halo">
          <circle cx="80" cy="65" r="46" fill="rgba(255, 215, 0, 0.25)" stroke="#f1c40f" stroke-width="2" stroke-dasharray="6,4" />
          <circle cx="80" cy="65" r="36" fill="rgba(255, 235, 100, 0.3)" />
          <text x="73" y="72" font-size="20" fill="#f39c12" font-weight="bold">卍</text>

    // ============================================================
    // 2. ÂM THANH & BỘ TỔNG HỢP NHẠC THIỀN DỰ PHÒNG (SMART AUDIO)
    // ============================================================
    const bgm = document.getElementById('bgmAudio');
    const musicBtn = document.getElementById('musicToggleBtn');
    const musicIcon = document.getElementById('musicIcon');
    const musicText = document.getElementById('musicText');

    let audioCtx = null;
    let isMusicPlaying = false;
    let synthTimer = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Bộ phát chuông xoay tịnh tâm (fallback khi không tải được file mp3)
    function playSingingBowlTone() {
      if (!isMusicPlaying) return;
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const freqs = [196, 392, 587.3, 880]; // Tần số thiền định G3, G4, D5, A5
        
        freqs.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq + (Math.random() * 2 - 1), now);

          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.08 / (idx + 1), now + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.5);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 4.6);
        });

        synthTimer = setTimeout(playSingingBowlTone, 4800);
      } catch (e) { }
    }

    function toggleMusic(e) {
      if (e) e.stopPropagation();
      getAudioContext();

      if (isMusicPlaying) {
        // Tắt nhạc
        bgm.pause();
        if (synthTimer) clearTimeout(synthTimer);
        isMusicPlaying = false;
        musicBtn.classList.remove('playing');
        musicIcon.innerText = '🔇';
        musicText.innerText = 'Đã Tắt Nhạc';
      } else {
        // Bật nhạc
        isMusicPlaying = true;
        musicBtn.classList.add('playing');
        musicIcon.innerText = '🎵';
        musicText.innerText = 'Đang Tịnh Tâm';

        const playPromise = bgm.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            console.log("Kích hoạt nhạc thiền Web Audio Synth...");
            playSingingBowlTone();
          });
        }
      }
    }

    function autoStartAudioOnInteract() {
      if (!isMusicPlaying) {
        toggleMusic();
      }
      document.removeEventListener('pointerdown', autoStartAudioOnInteract);
    }
    document.addEventListener('pointerdown', autoStartAudioOnInteract, { once: true });

    // Hiệu ứng âm thanh que diêm
    function playMatchStrikeSFX() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const bufSize = ctx.sampleRate * 0.25;
        const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = ctx.createBufferSource();
        noise.buffer = buf;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1500, now);
        filter.frequency.exponentialRampToValueAtTime(3200, now + 0.1);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.4, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(now);
      } catch (e) { }
    }

    // Hiệu ứng âm thanh lắc ống xăm tre
    function playBambooShakeSFX() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        for (let i = 0; i < 5; i++) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(380 + Math.random() * 260, now + i * 0.16);

          gain.gain.setValueAtTime(0, now + i * 0.16);
          gain.gain.linearRampToValueAtTime(0.2, now + i * 0.16 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.16 + 0.11);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.16);
          osc.stop(now + i * 0.16 + 0.12);
        }
      } catch (e) { }
    }

    // ============================================================
    // 5. HIỆU ỨNG KHÓI NHANG (SMOKE CANVAS ENGINE)
    // ============================================================
    const smokeCacheCanvas = document.createElement('canvas');
    smokeCacheCanvas.width = 64;
    smokeCacheCanvas.height = 64;
    const sCacheCtx = smokeCacheCanvas.getContext('2d');
    const grad = sCacheCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(235, 230, 220, 0.45)');
    grad.addColorStop(0.5, 'rgba(195, 190, 180, 0.2)');
    grad.addColorStop(1, 'rgba(195, 190, 180, 0)');
    sCacheCtx.fillStyle = grad;
    sCacheCtx.beginPath();
    sCacheCtx.arc(32, 32, 32, 0, Math.PI * 2);
    sCacheCtx.fill();

    const canvas = document.getElementById('smokeCanvas');
    const ctx = canvas.getContext('2d');
    const smokeParticles = [];

    class SmokeParticle {
      constructor(x, y) {
        this.x = x + (Math.random() - 0.5) * 4;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = -(Math.random() * 0.8 + 0.5);
        this.size = Math.random() * 4 + 4;
        this.maxSize = Math.random() * 22 + 16;
        this.life = 0;
        this.maxLife = Math.random() * 90 + 70;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.size += (this.maxSize - this.size) * 0.02;
        this.life++;
      }
      draw() {
        const alpha = Math.max(0, 1 - (this.life / this.maxLife));
        ctx.globalAlpha = alpha;
        ctx.drawImage(
          smokeCacheCanvas,
          this.x - this.size,
          this.y - this.size,
          this.size * 2,
          this.size * 2
        );
      }
    }

    function renderSmoke() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (offeringStartTime > 0) {
        const elapsed = (performance.now() - offeringStartTime) / 1000;
        if (elapsed <= 3.2) {
          let progress = elapsed / 3.2;
          let tipY;
          if (progress < 0.25) tipY = (canvas.height - 30) - (progress / 0.25) * 220;
          else if (progress < 0.55) tipY = canvas.height - 250;
          else tipY = (canvas.height - 250) + ((progress - 0.55) / 0.45) * 215;

          if (smokeParticles.length < 50) {
            smokeParticles.push(new SmokeParticle(canvas.width / 2, tipY));
          }
        } else {
          offeringStartTime = 0;
        }
      }

      if (isLit && smokeParticles.length < 45) {
        if (Math.random() > 0.5) {
          smokeParticles.push(new SmokeParticle(155, canvas.height - 20));
          smokeParticles.push(new SmokeParticle(170, canvas.height - 35));
          smokeParticles.push(new SmokeParticle(185, canvas.height - 20));
        }
      }

      for (let i = smokeParticles.length - 1; i >= 0; i--) {
        const p = smokeParticles[i];
        p.update();
        p.draw();
        if (p.life >= p.maxLife) smokeParticles.splice(i, 1);
      }
      requestAnimationFrame(renderSmoke);
    }
    renderSmoke();

    function resizeAllCanvases() {
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
      pCanvas.width = window.innerWidth;
      pCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeAllCanvases);
    resizeAllCanvases();

    const fxParticles = [];
    class MagicParticle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = Math.random() * 3 + 1.5;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3.5 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = Math.random() * 15 + 15;
        this.maxLife = this.life;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
      }
      draw() {
        fxCtx.save();
        fxCtx.globalAlpha = Math.max(0, this.life / this.maxLife);
        fxCtx.fillStyle = this.color;
        fxCtx.beginPath();
        fxCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();
      }
    }

    function spawnSpellBurst(x, y, color) {
      for (let i = 0; i < 20; i++) fxParticles.push(new MagicParticle(x, y, color));
    }

    function renderFX() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      for (let i = fxParticles.length - 1; i >= 0; i--) {
        const p = fxParticles[i];
        p.update();
        p.draw();
        if (p.life <= 0) fxParticles.splice(i, 1);
      }
      requestAnimationFrame(renderFX);
    }
    renderFX();

    const petals = [];
    class Petal {
      constructor() { this.reset(true); }
      reset(init = false) {
        this.x = Math.random() * pCanvas.width;
        this.y = init ? Math.random() * pCanvas.height : -30;
        this.w = Math.random() * 5 + 8;
        this.h = this.w * 1.35;
        this.speedY = Math.random() * 0.7 + 0.5;
        this.speedX = Math.random() * 0.4 + 0.2;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.02;
        this.flipX = Math.random() * Math.PI;
        this.swing = Math.random() * Math.PI * 2;
        this.color = Math.random() > 0.5 ? 'rgba(255, 175, 195, 0.6)' : 'rgba(240, 140, 165, 0.6)';
      }
      update() {
        this.swing += 0.02;
        this.flipX += 0.02;
        this.rotation += this.rotSpeed;
        this.x += this.speedX + Math.sin(this.swing) * 0.5;
        this.y += this.speedY;
        if (this.y > pCanvas.height + 30 || this.x > pCanvas.width + 30) this.reset(false);
      }
      draw() {
        pCtx.save();
        pCtx.translate(this.x, this.y);
        pCtx.rotate(this.rotation);
        pCtx.scale(Math.cos(this.flipX), 1);
        pCtx.fillStyle = this.color;
        pCtx.beginPath();
        pCtx.ellipse(0, 0, this.w / 2, this.h / 2, 0, 0, Math.PI * 2);
        pCtx.fill();
        pCtx.restore();
      }
    }
    for (let i = 0; i < 22; i++) petals.push(new Petal());

    function renderPetals() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      petals.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(renderPetals);
    }
    renderPetals();

    function showMantra(x, y, text) {
      const bubble = document.createElement('div');
      bubble.className = 'mantra-bubble';
      bubble.innerText = text;
      bubble.style.left = (x - 40) + 'px';
      bubble.style.top = (y - 30) + 'px';
      document.body.appendChild(bubble);
      setTimeout(() => bubble.remove(), 1400);
    }

    function getFigureCenter(el) {
      const rect = el.getBoundingClientRect();
      return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    }

    const mantras = [
      { id: 'buddha', color: '#f1c40f', text: '卍 PHẬT QUANG PHỔ CHIẾU 卍' },
      { id: 'guanyin', color: '#74b9ff', text: '💧 CAM LỘ TỊNH TÂM 💧' },
      { id: 'jadeEmperor', color: '#f39c12', text: '👑 THIÊN ÂN BAN PHƯỚC 👑' },
      { id: 'tripitaka', color: '#ffeaa7', text: '📿 A DI ĐÀ PHẬT 📿' },
      { id: 'dragonHorse', color: '#81ecec', text: '⚡ LONG MÃ HÍ VANG ⚡' },
      { id: 'wukong', color: '#e74c3c', text: '🐒 THIẾT BẢNG QUẦN MA 🐒' },
      { id: 'bajie', color: '#fab1a0', text: '🐷 HỈ HẢ AN NHIÊN 🐷' },
      { id: 'bullKing', color: '#a4b0be', text: '🐂 OAI PHONG LẪM LIỆT 🐂' },
      { id: 'redBoy', color: '#ff4757', text: '🔥 TAM MUỘI CHÂN HỎA 🔥' }
    ];

    mantras.forEach(item => {
      const el = document.getElementById(item.id);
      if (el) {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          getAudioContext();
          const pos = getFigureCenter(el);
          spawnSpellBurst(pos.x, pos.y, item.color);
          showMantra(pos.x, pos.y, item.text);
        });
      }
    });
  </script>
</body>

</html>
